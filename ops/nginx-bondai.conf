# nginx config for bondai.ru — DRAFT, НЕ ЗЕРКАЛО ПРОДА. НЕ НАКАТЫВАТЬ КАК ЕСТЬ.
#
# Боевой конфиг — /etc/nginx/sites-available/bondai.ru, и он устроен иначе:
#   * TLS: сертификат ОБЩИЙ, /etc/letsencrypt/live/bananagen.ru/ на 18 доменов
#     (включая bondai.ru и www.bondai.ru). Отдельного live/bondai.ru НЕ СУЩЕСТВУЕТ —
#     этот файл ссылается на него в шести местах, поэтому `nginx -t` упадёт,
#     а reload отвергнет конфигурацию ЦЕЛИКОМ и положит все сайты сервера.
#   * HTTP/80 и редирект www→apex делает Certbot (`return 404` + два `if ($host…)`),
#     каталога /var/www/certbot на сервере нет.
#   * Задача, ради которой файл писался, решена: www.bondai.ru резолвится,
#     покрыт общим сертификатом и отвечает HTTP/2 200.
#
# Что из него применено на прод точечно (11.08.2026):
#   * server_tokens off — вынесен в http-контекст /etc/nginx/nginx.conf,
#     см. ops/nginx-gzip.conf; там же живёт gzip.
#   * client_max_body_size — НЕ нужен: глобальные 20m щедрее здешних 16m.
#   * proxy_read_timeout 120s — НЕ нужен: у bondai ноль 504 и ноль upstream
#     timeout при дефолтных 60s; тяжёлые страницы отвечают за десятые секунды.
#
# Файл оставлен как черновик желаемой раскладки (отдельный cert, свой ACME-блок).
# Прежде чем что-то отсюда катить — сверять с фактическим состоянием сервера.

# HTTP (80) — ACME challenge + redirect everything to canonical HTTPS apex.
server {
    listen 80;
    server_name bondai.ru www.bondai.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://bondai.ru$request_uri;
    }
}

# HTTPS (443) www → apex redirect. Enable only after the cert covers www.bondai.ru.
server {
    listen 443 ssl;
    server_name www.bondai.ru;

    ssl_certificate     /etc/letsencrypt/live/bondai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bondai.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/bondai.ru/chain.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    return 301 https://bondai.ru$request_uri;
}

# HTTPS (443) apex — the application.
server {
    listen 443 ssl;
    server_name bondai.ru;

    ssl_certificate     /etc/letsencrypt/live/bondai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bondai.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/bondai.ru/chain.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 16M;
    server_tokens off;

    location / {
        proxy_pass         http://127.0.0.1:8002;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
