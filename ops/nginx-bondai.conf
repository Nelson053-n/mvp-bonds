# nginx config for bondai.ru — versioned copy of /etc/nginx/sites-available/bondai.ru
#
# Adds www.bondai.ru → bondai.ru redirect over HTTPS. Requires, in order:
#   1. DNS: A-record  www.bondai.ru → <server IP>   (currently MISSING — www does not resolve)
#   2. TLS: extend the certificate to cover www:
#        certbot --nginx -d bondai.ru -d www.bondai.ru
#      (or certonly + reload). Without www in the cert, the HTTPS www block 502s on TLS.
#   3. nginx -t && systemctl reload nginx
#
# See ops/README.md for the rollout checklist.

# HTTP (80) — ACME challenge + redirect everything to canonical HTTPS apex.
server {
    listen 80;
    server_name bondai.ru www.bondai.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://bondai.ru$request_uri;
    }
}

# HTTPS (443) www → apex redirect. Enable only after the cert covers www.bondai.ru.
server {
    listen 443 ssl;
    server_name www.bondai.ru;

    ssl_certificate     /etc/letsencrypt/live/bondai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bondai.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/bondai.ru/chain.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    return 301 https://bondai.ru$request_uri;
}

# HTTPS (443) apex — the application.
server {
    listen 443 ssl;
    server_name bondai.ru;

    ssl_certificate     /etc/letsencrypt/live/bondai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bondai.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/bondai.ru/chain.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 16M;
    server_tokens off;

    location / {
        proxy_pass         http://127.0.0.1:8002;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
