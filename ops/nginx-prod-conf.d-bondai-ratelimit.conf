# Rate-limit зона публичных SEO-страниц bondai.ru. Объявляется в http-контексте.
#
# bond_rl — /bond/{ISIN}. Промах кэша страницы стоит похода в MOEX и SmartLab,
#           а SmartLab ограничен 4 зап/с на весь процесс. При обходе краулером
#           десятки страниц вставали в эту очередь и не укладывались в таймаут
#           nginx: 31.08.2026 YandexBot дал 31×504 за одну минуту (всего 85 из
#           98 пятисоток на /bond/ пришлись на него, 6 — на Googlebot).
#
# 2r/s с burst=20 delay=5: первые 5 запросов пачки уходят сразу, следующие 15
# растягиваются по 2 в секунду, и только сверх того — отказ. Живой посетитель
# читает одну страницу и лимита не замечает; краулер притормаживается вместо
# того, чтобы получить 5xx и пометить сайт нестабильным.
limit_req_zone $binary_remote_addr zone=bond_rl:10m rate=2r/s;

# 429 вместо дефолтного 503: Google трактует его как «слишком часто, вернусь
# позже» и не считает это ошибкой сервера, в отличие от 5xx.
limit_req_status 429;
# Вход, регистрация и сброс пароля: 1 запрос/с с IP (+10 запаса). До 12.10.2026
# у /auth/ не было лимита на уровне nginx, и перебор кода сброса упирался только
# в скорость приложения (аудит, H1).
limit_req_zone $binary_remote_addr zone=auth_rl:10m rate=1r/s;
