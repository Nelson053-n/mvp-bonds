# gzip settings for bondai.ru — versioned copy of the "Gzip Settings" block
# in /etc/nginx/nginx.conf (http context, applies to every vhost on the server).
#
# Ubuntu ships this block with only `gzip on;` active and everything else
# commented out. With no gzip_types, nginx compresses text/html ONLY — so the
# HTML pages were compressed but the biggest assets were not:
#
#   /static/app.js          485 KB → 99 KB   (-80%)
#   /sitemap-bonds.xml      305 KB → 9 KB    (-97%)
#   /static/translations.js  55 KB → 12 KB   (-78%)
#   /static/styles.css       45 KB → 9 KB    (-80%)
#
# First load of /app went from 586 KB to 120 KB of transfer. Applied on prod
# 2026-08-10 (backup: /root/nginx.conf.bak-20260810-133558).
#
# gzip_min_length 1024 keeps small JSON replies uncompressed — below ~1 KB the
# gzip header costs more than it saves. gzip_proxied any is required because
# the app sits behind nginx as a proxy; without it proxied responses skip gzip.
#
# Rollout: paste into the "Gzip Settings" block of /etc/nginx/nginx.conf,
# replacing the commented-out defaults, then `nginx -t && systemctl reload nginx`.

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss application/rss+xml image/svg+xml text/javascript;
