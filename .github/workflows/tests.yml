name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest --no-cov -W ignore
        env:
          MVP_JWT_SECRET: ci_secret_for_tests
          MVP_LLM_MODE: stub
